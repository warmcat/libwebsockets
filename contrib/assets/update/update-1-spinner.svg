<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
 <!--
  Update in progress spinner, animated with SMIL.  It's calm on purpose: a
  display may only be redrawn a couple of times a second, slowly enough to
  see, so there are only two moving parts, and each moves on only a little
  in 0.5s, 30 and 15 degrees
 -->

 <!-- a faint track the arc goes around on, still -->
 <circle cx="24" cy="24" r="19" fill="none" stroke="#1a5c3a" stroke-width="4" opacity="0.2"/>

 <!-- an arc of a little over a quarter turn, going round once in 6s -->
 <path d="M24 5 A19 19 0 0 1 42.71 27.30" fill="none" stroke="#1a5c3a" stroke-width="4" stroke-linecap="round">
  <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="6s" repeatCount="indefinite"/>
 </path>

 <!-- a dot going round inside it the other way, once in 12s -->
 <circle r="3" fill="#e8701a">
  <animateMotion path="M24 14 A10 10 0 0 0 24 34 A10 10 0 0 0 24 14" dur="12s" repeatCount="indefinite"/>
 </circle>
</svg>
