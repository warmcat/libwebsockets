query-filters:
  - exclude:
      id: cpp/short-global-name
  - exclude:
      id: cpp/useless-expression
  - exclude:
      id: cpp/irregular-enum-init
  - exclude:
      id: cpp/loop-variable-changed
  - exclude:
      id: cpp/trivial-switch
  - exclude:
      id: cpp/include-non-header
  - exclude:
      id: cpp/commented-out-code
  - exclude:
      id: cpp/long-switch
  - exclude:
      id: cpp/complex-block
  - exclude:
      id: cpp/poorly-documented-function
  - exclude:
      id: cpp/stack-address-escape
  - exclude:
      id: cpp/use-of-goto
  - exclude:
      id: cpp/user-controlled-bypass
  - exclude:
      id: cpp/incorrect-not-operator-usage
  - exclude:
      id: cpp/path-injection
  - exclude:
      id: cpp/declaration-hides-variable
  - exclude:
      id: cpp/complex-condition
  # Flags every "http" string literal, including protocol names in a library
  # whose job is to speak http
  - exclude:
      id: cpp/non-https-url
  # Flags sending the proxy CONNECT with its basic auth to an http proxy,
  # which is how http proxies work
  - exclude:
      id: cpp/cleartext-transmission
  # All the javascript in the tree runs in browsers, where console.log()
  # of a peer-supplied value is not a log forging vector
  - exclude:
      id: js/log-injection
  # Same reasoning as the cpp variant above: the login page's flow is
  # necessarily steered by the redirect_uri the server validates
  - exclude:
      id: js/user-controlled-bypass

paths-ignore:
  # captured third-party pages used as parser test vectors, not our code
  - minimal-examples-lowlevel/api-tests/api-test-lhp-dlo/vectors
