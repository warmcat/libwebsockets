sonar.exclusions=**/*.pem,**/*.key,**/lws-ssh-test-keys,**/lws-ssh-test-keys.pub,**/localhost-100y.key,**/vectors/**,**/api-test-lhp-dlo/cases/**,**/seeds/**
# **/vectors/** above: the api-test-lhp-dlo vectors are verbatim captured
# third-party pages (slashdot, lobsters) used as immutable input fixtures for
# the HTML/CSS parser and DLO rendering tests.  They are data, not code we
# maintain; CSS style findings on them (duplicate properties, shorthand
# overrides...) describe the captured site's css, which we must not edit.
#
# **/api-test-lhp-dlo/cases/** is the same class: hand-written html fixtures
# that deliberately include deprecated markup (eg <big>, <s>) to exercise the
# parser / renderer handling of it, so HTML conformance findings on them are
# the point of the fixture rather than a defect.

# **/seeds/** likewise: fuzz seed corpora are input data deliberately full
# of hostile / edge-case content; some seeds are .c files (parse targets
# for the syntax-highlight fuzzers), which the analyzers otherwise treat as
# code to build and flag style rules on.

# c:S1313 (hardcoded IP) fires on example/test code and is a false positive
# project-wide here.
#
# Note: secrets:S6706 (hardcoded private key) used to be listed here, but
# scanner-side issue.ignore.multicriteria does NOT suppress findings from the
# secrets analyzer (the two localhost test-key findings stayed open for years
# after these exclusions were added). It is instead disabled at the quality
# profile level: org "warmcat" custom "lws" secrets profile, with S6706
# deactivated, and the project is assigned to that profile.
#
# c:S5332 ("Clear-text protocols should not be used" / "Using HTTP is
# insecure") is likewise disabled at the quality profile level (org "warmcat"
# custom "lws" C profile).  It fires on http:// URL *string comparisons* such
# as the OAuth2 client plugin's open-redirect sanitizer, not on actual
# protocol use; there is no way to write the defense it objects to without
# triggering it.
#
# c:S1219 (non-case labels inside switch), c:S999 (backward goto) and c:S1909
# (goto into a block) are MISRA C control-flow style rules.  lws parsers and
# state machines (lejp, lecp, lhp, hpack, the http header parser, sshd, the
# ACME client...) deliberately use labels inside switch cases, and shared
# tail-code labels, as their state-machine idiom: rewriting them into flag
# variables and nested loops would be a large, risk-bearing refactor of
# security-relevant code for no functional gain.  Every flagged jump has been
# checked to target a label that is immediately preceded by its enclosing
# block's opening or by plain statements, so no initialised declaration is
# skipped.  Excluded project-wide rather than accepted issue-by-issue.
#
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,e31,e32,e33,e34,e35,e36,e37,e38,e39,e40,e41,e42,e43,e44,e45,e46,e47,e48,e49,e50,e51,e52,e53,e54,e55,e56,e57,e58,e59,e60,e61,e62,e63,e64,e65,e66,e67,e68,e69,e70,e71,e72,e73,e74,e75,e76,e77,e78,e79,e80,e81,e82,e83,e84,e85,e86,e87,e88,e89,e90,e91,e92
sonar.issue.ignore.multicriteria.e1.ruleKey=c:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=**
