# Group A (C idiom/style): lws is a 2010-era C library whose parsers,
# state machines and build architecture deliberately use these idioms
# (assignment-in-condition with explicit double parens, short scoped
# names, implicit string concat for long log messages, function names as
# callbacks, gated late includes, enum-alias helper tables...).
# "Fixing" them is unbounded churn with no correctness payoff; several
# (S3562 default cases, S912 scan-loop side effects) would actively
# defeat -Wswitch exhaustiveness checking or obfuscate hot loops.
