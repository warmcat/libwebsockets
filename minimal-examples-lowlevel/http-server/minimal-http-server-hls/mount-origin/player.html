<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LWS Media Player</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="player.css">
    <script src="hls.min.js" defer></script>
    <script src="player.js" defer></script>
</head>
<body>

    <div class="header">
        <div id="auth-status"></div>
        <script src="/lws-login-media/lws-login.js"></script>
        <h2>LWS Media Player</h2>
        <a href="." class="back-link">← Back to Library</a>
    </div>

    <div id="video-filename" class="video-title"></div>

    <div class="player-container">
        <video id="video" controls></video>
        <div id="cue-display" class="cue-display"></div>
    </div>

    <div class="button-container">
        <div class="button-group">
            <button id="toggle-logs-btn" class="toggle-btn">logs</button>
            <button id="fs-btn" class="toggle-btn" title="Fullscreen">&#x26F6;</button>
            <select id="aud-lang" class="toggle-btn hidden" title="Audio language"></select>
            <select id="sub-lang" class="toggle-btn hidden" title="Subtitle language"></select>
            <button id="cc-btn" class="toggle-btn hidden" title="Toggle subtitles">CC</button>
        </div>
        <button id="delete-btn" class="toggle-btn danger-btn hidden">&#x1F5D1; delete</button>
    </div>

    <div id="debug-panel" class="debug-panel hidden">
        <h3>Player Logs</h3>
        <div id="debug-logs" class="debug-logs">Ready.</div>
    </div>

</body>
</html>
