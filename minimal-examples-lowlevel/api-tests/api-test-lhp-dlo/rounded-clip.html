<!doctype html>
<html><head><style>
* { margin: 0; padding: 0 }
body { margin: 0; background-color: #ffffff }
.c { position: absolute; overflow: hidden }
.f { position: absolute; left: 0; top: 0; background-color: #24476b }
#a { left: 20px; top: 20px; width: 200px; height: 24px; border-radius: 12px }
#a .f { width: 200px; height: 24px }
#b { left: 20px; top: 60px; width: 120px; height: 50px;
     border-radius: 8px 20px 4px 14px; background-color: #dddddd }
#b .f { width: 120px; height: 50px; background-color: #c03020 }
#d { left: 20px; top: 130px; width: 200px; height: 24px; border-radius: 12px }
#d .f { width: 6px; height: 24px }
#e { left: 20px; top: 170px; width: 200px; height: 24px; border-radius: 12px }
#e .f { left: 195px; width: 5px; height: 24px }
</style></head>
<body>
<div class="c" id="a"><div class="f"></div></div>
<div class="c" id="b"><div class="f"></div></div>
<div class="c" id="d"><div class="f"></div></div>
<div class="c" id="e"><div class="f"></div></div>
</body></html>
