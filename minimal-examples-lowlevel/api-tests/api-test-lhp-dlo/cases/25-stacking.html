<!--
 A positioned box with a z-index is a stacking context: its own positioned,
 z-indexed descendants are raised to the end of its children, not to the
 end of the body's, so the footer's background paints under its breadcrumbs
 and not over them (apple.com footer: .footer { position: relative;
 z-index: 1 } > .footer-breadcrumbs { position: relative; z-index: 1 }).
 An absolute box likewise keeps its raised descendants.
-->
<html><head><style>
body{margin:0}
.footer{position:relative;z-index:1;background-color:#f5f5f7;padding:10px}
.crumbs{position:relative;z-index:1}
.legal{position:relative;z-index:1;top:-3px}
.panel{position:absolute;top:100px;left:20px;width:200px;height:60px;background-color:#ccc}
.badge{position:relative;z-index:2}
</style></head><body>
<p>flow</p>
<div class="footer"><div class="crumbs">Blog</div><div class="legal">Copyright</div></div>
<div class="panel"><span class="badge">badge</span></div>
</body></html>
