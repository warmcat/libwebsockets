<!doctype html>
<html><head><style>
:root { --brand: #336699; --paper: rgb(250, 250, 240) }
body { font-size: 12px; margin: 0; padding: 0; background: var(--paper) }
.n { color: red; background-color: lightgray }
.r { color: rgb(0, 128, 0); background: rgba(255, 0, 0, 0.5) }
.h { color: hsl(240, 100%, 50%); background-color: hsl(60 100% 50%) }
.v { color: var(--brand); background: url("missing.png") no-repeat blue }
.t { background: transparent; color: #123 }
.s { color: Orange }
</style></head>
<body>
<div class="n">named colours</div>
<div class="r">rgb and rgba</div>
<div class="h">hsl forms</div>
<div class="v">variable and background shorthand with url</div>
<div class="t">transparent shorthand</div>
<div class="s">case insensitive name</div>
</body></html>
