<!doctype html>
<html><head><style>
body { font-size: 12px; margin: 0; padding: 0 }
.bar { height: 40px; line-height: 40px; background-color: #006666 }
.bar a { display: inline-block; padding: 0 15px; color: #ffffff }
.ico { display: inline-block; width: 12px; height: 12px; line-height: 40px;
       background-image: url(swatch-red.svg); background-repeat: no-repeat;
       background-position: center center }
.right { float: right; padding-right: 20px }
.details { padding: 5px 20px; background-color: #f2f2f2; line-height: 22px }
.views { padding: 9px 0 }
.byline { position: absolute; height: 20px; padding-left: 10px }
.img { height: 64px }
</style></head>
<body>
<div class="bar"><a><i class="ico"></i> <span>Software</span></a><a>Next</a><div class="right">Follow us:</div></div>
<div class="details"><span class="views"></span><span class="byline">Posted by Someone on a day from the dept.</span></div>
<div>Text and an image <img src="swatch-yellow.svg" width="64" height="64"> sit on the baseline</div>
</body></html>
