<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset=utf-8 http-equiv="Content-Language" content="en"/>
   <link rel="stylesheet" type="text/css" href="sai.css?v=15"/>
   <link rel="icon" href="sai-icon.svg" sizes="any" type="image/svg+xml"/>
   <link rel="alternate" type="application/rss+xml" title="Sai build events" href="rss.xml"/>
    <script type='text/javascript' src='sai.js?v=14'></script>
    <script type='text/javascript' src='terminal-core.js'></script>
    <script type='text/javascript' src='sai-terminal.js'></script>
    <script type='text/javascript' src='lws-login.js'></script>
    <script type='text/javascript' src="lws-common.js"></script>
 <title>Sai</title>
 </head>
	<body class="overlay-active">
		<div class="overlay"></div>
		<div class="main-container">
			<div class="left-pane">
				<div class="sidebar-pane" id="sai_sidebar">
					<div class="sb-col sb-col-logo" id="sai_sb_logo">
						<div class="logo">
							<img class="logo" src="sai.svg">
							<div class="logo-text">
								<span class="logo"><a href="https://warmcat.com/git/sai">Sai git</a></span>
								<span class="logo" id="apirev"></span>
								<a class="logo-rss" href="rss.xml" title="RSS feed of the latest build events"><img src="rss.png" alt="RSS"></a>
							</div>
						</div>
						<div id="lws-login-status-container" class="login-status-container"></div>
					</div>
					<div class="sb-col sb-col-projects" id="sai_sb_projects"></div>
					<div class="sb-col sb-col-branches" id="sai_sb_branches"></div>
					<div class="sb-col sb-col-events" id="sai_sb_events"></div>
				</div>
				<div class="tasks-section" id="sai_event_tasks"></div>
				<div class="resizer-h" id="resizer_h"></div>
				<div class="logs-section" id="sai_task_logs_container">
					<div id="sai_sticky" class="sticky"></div>
					<div id="p2" class="undernailed">
						<div class="summary" id="summary">
							<noscript><span id="noscript" class="noscript">Please enable Javascript</span></noscript>
							<div id="sai_overview"></div>
							<div id="sai_task"></div>
						</div>
					</div>
				</div>
			</div>
			<div class="resizer" id="resizer"></div>
			<div class="right-pane">
				<div id="sai_power_overview" class="power-overview hidden">
					<div class="power-text">Total Power: <span id="sai_total_power">0W</span></div>
					<canvas id="sai_power_graph" class="power-graph" height="20" width="150"></canvas>
				</div>
				<div id="sai_builders"></div>
			</div>
		</div>
	</body>
</html>
